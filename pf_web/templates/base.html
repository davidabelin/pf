<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Polyfolds{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Baskervville:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  </head>
  <body>
    <div class="bg-orb bg-orb-a"></div>
    <div class="bg-orb bg-orb-b"></div>
    <header class="site-header">
      <a class="brand" href="{{ url_for('main.home') }}">{{ app_display_name }}</a>
      <nav class="site-nav">
        <a href="{{ url_for('main.home') }}">Home</a>
        <a href="{{ aix_hub_url }}">Back to AIX Hub</a>
      </nav>
    </header>
    <main class="page">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-copy">GNU copyright 2026 AIX Protodyne</p>
        <nav class="footer-links" aria-label="AIX footer">
          <a href="{{ aix_contact_url }}">Contact Us</a>
          <a href="{{ aix_privacy_url }}">Privacy</a>
          <a href="{{ aix_toc_url }}">AIX TOC</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
